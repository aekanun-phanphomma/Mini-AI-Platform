# Phase 2: RAG stack บนเครื่อง (ADR-0011, 0012, 0013)
#
#  client ──▶ rag-api :8000 ──▶ ollama :11434  (embed + chat)
#                        └────▶ qdrant :6333   (vector search)
name: ailab-phase2

x-models: &models
  CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:1.5b}
  EMBED_MODEL: ${EMBED_MODEL:-bge-m3}

services:
  ollama:
    image: ollama/ollama:0.6.5
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama   # โมเดลขนาดหลาย GB เก็บใน volume จะได้ไม่ต้องโหลดใหม่
    environment:
      OLLAMA_KEEP_ALIVE: 30m          # เก็บโมเดลไว้ใน RAM จะได้ไม่ต้อง cold start ทุก request
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 20

  # one-shot: ดึงโมเดลให้ครบก่อน แล้ว rag-api ค่อย start
  ollama-pull:
    image: ollama/ollama:0.6.5
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      <<: *models
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull $$CHAT_MODEL && ollama pull $$EMBED_MODEL"]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"   # REST + dashboard: http://localhost:6333/dashboard
    volumes:
      - qdrant-data:/qdrant/storage

  rag-api:
    build: ../apps/rag-api
    image: rag-api:dev
    depends_on:
      qdrant:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully
    environment:
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
      CHUNK_SIZE: ${CHUNK_SIZE:-800}   # ทดลอง: CHUNK_SIZE=300 make up
      TOP_K: ${TOP_K:-4}
      <<: *models
    ports:
      - "8000:8000"   # API docs: http://localhost:8000/docs

volumes:
  ollama-models:
  qdrant-data:
