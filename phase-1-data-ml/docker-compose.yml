# Phase 1 infrastructure: S3 (SeaweedFS) + Postgres + MLflow
# ADR-0008 (DVC + S3), ADR-0009 (MLflow)
#
#   ┌──────────┐  metadata   ┌──────────┐
#   │  MLflow  │────────────▶│ Postgres │
#   │  :5000   │  artifacts  └──────────┘
#   │          │────────────▶┌──────────┐◀──── DVC (data versions)
#   └──────────┘             │ SeaweedFS│
#                            │ S3 :8333 │
#                            └──────────┘
name: ailab-phase1

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  # S3-compatible object storage. ใช้แทน MinIO ที่เลิกเผยแพร่ image แล้ว (ADR-0008)
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    # สร้างไฟล์ identity จาก env ตอน start เพื่อไม่ให้ secret อยู่ในไฟล์ที่ commit
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"lab","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed server -ip=seaweedfs -ip.bind=0.0.0.0 -dir=/data \
          -s3 -s3.port=8333 -s3.config=/tmp/s3.json \
          -master.volumeSizeLimitMB=1024 -volume.max=0
    ports:
      - "8333:8333"   # S3 API
      - "9333:9333"   # master UI
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9333/cluster/status >/dev/null"]
      interval: 5s
      retries: 30

  # one-shot job: สร้าง bucket แล้วจบ (pattern เดียวกับ Kubernetes Job)
  s3-init:
    image: amazon/aws-cli:2.22.0
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for b in mlflow dvc; do
          until aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket $$b 2>/dev/null \
                || aws --endpoint-url http://seaweedfs:8333 s3 mb s3://$$b; do
            echo "waiting for S3..."; sleep 2
          done
        done
        echo "buckets ready"

  mlflow:
    build: ./mlflow
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    # --artifacts-destination: MLflow server เป็นคน proxy การอ่าน/เขียน artifact เอง
    # client (training script) จึงไม่ต้องมี S3 credential (ADR-0009)
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      --artifacts-destination s3://mlflow
      --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      retries: 20

volumes:
  pg-data:
  s3-data:
