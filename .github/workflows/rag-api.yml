# CI/CD ของ rag-api (ADR-0018)
#   PR        : lint + test
#   push main : lint + test → build image → push GHCR → แก้ tag ใน values-lab.yaml → Argo CD deploy
# CI ไม่มีสิทธิ์เข้า cluster เลย มีแค่สิทธิ์เขียน Git (pull-based GitOps)
name: rag-api

on:
  push:
    branches: [main]
    paths:
      - "apps/rag-api/**"
      - ".github/workflows/rag-api.yml"
  pull_request:
    paths:
      - "apps/rag-api/**"

permissions:
  contents: write   # commit tag กลับเข้า repo
  packages: write   # push image เข้า GHCR

concurrency:
  group: rag-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rag-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.4"
      - run: uv pip install --system -r pyproject.toml --extra dev
      - run: ruff check .
      - run: pytest -q

  build-and-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ชื่อ image บน GHCR ต้องเป็นตัวพิมพ์เล็ก
      - id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rag-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tag = git sha (immutable) ห้ามใช้ :latest ในการ deploy
      # เพราะจะไม่รู้ว่ากำลังรันเวอร์ชันไหน และ rollback ไม่ได้
      - uses: docker/build-push-action@v6
        with:
          context: apps/rag-api
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.sha }}
            ${{ steps.img.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump image in GitOps values
        env:
          IMAGE: ${{ steps.img.outputs.name }}
        run: |
          yq -i ".image.repository = \"$IMAGE\" | .image.tag = \"$GITHUB_SHA\"" \
            phase-3-platform/charts/rag-api/values-lab.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(rag-api): ${GITHUB_SHA::7} [skip ci]"
          git push
