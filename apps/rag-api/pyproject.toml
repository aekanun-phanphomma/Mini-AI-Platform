[project]
name = "rag-api"
version = "0.1.0"
description = "Stateless RAG service: Ollama (LLM + embeddings) + Qdrant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "qdrant-client>=1.12,<2",
    "prometheus-client>=0.21",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
