# StatefulSet (ไม่ใช่ Deployment) เพราะ database ต้องมี identity และ volume ของตัวเองที่คงที่
# pod ชื่อ qdrant-0 จะได้ PVC ชื่อ storage-qdrant-0 ตัวเดิมเสมอ แม้ถูกย้ายไป node อื่น
apiVersion: v1
kind: Service
metadata:
  name: qdrant-headless
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: qdrant }
  ports:
    - { name: http, port: 6333 }
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
spec:
  selector: { app.kubernetes.io/name: qdrant }
  ports:
    - { name: http, port: 6333, targetPort: http }
    - { name: grpc, port: 6334, targetPort: grpc }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  labels: { app.kubernetes.io/name: qdrant }
spec:
  serviceName: qdrant-headless
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: qdrant }
  template:
    metadata:
      labels: { app.kubernetes.io/name: qdrant }
    spec:
      containers:
        - name: qdrant
          image: {{ .Values.qdrant.image }}
          ports:
            - { name: http, containerPort: 6333 }
            - { name: grpc, containerPort: 6334 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 15
          resources: {{- toYaml .Values.qdrant.resources | nindent 12 }}
          volumeMounts:
            - { name: storage, mountPath: /qdrant/storage }
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.qdrant.storage }}
