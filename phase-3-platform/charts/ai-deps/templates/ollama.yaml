apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.ollama.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels: { app.kubernetes.io/name: ollama }
spec:
  replicas: 1
  # Recreate: PVC เป็น ReadWriteOnce ถ้าใช้ RollingUpdate pod ใหม่จะ mount volume ไม่ได้
  # ระหว่างที่ pod เก่ายังไม่ตาย
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: ollama }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ollama }
    spec:
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          ports:
            - { name: http, containerPort: 11434 }
          env:
            - { name: OLLAMA_KEEP_ALIVE, value: {{ .Values.ollama.keepAlive | quote }} }
          readinessProbe:
            httpGet: { path: /api/version, port: http }
            periodSeconds: 5
          resources: {{- toYaml .Values.ollama.resources | nindent 12 }}
          volumeMounts:
            - { name: models, mountPath: /root/.ollama }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: ollama-models }
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector: { app.kubernetes.io/name: ollama }
  ports:
    - { name: http, port: 11434, targetPort: http }
---
# Helm hook → Argo CD แปลงเป็น PostSync hook: รันหลัง sync ทุกครั้ง
# pull ซ้ำไม่เสียเวลาเพราะ Ollama เช็กว่ามีโมเดลอยู่แล้ว
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-models
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: curlimages/curl:8.11.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until curl -sf http://ollama:11434/api/version >/dev/null; do echo "waiting for ollama"; sleep 3; done
              {{- range .Values.ollama.models }}
              echo "pulling {{ . }}"
              curl -sf -X POST http://ollama:11434/api/pull -d '{"model":"{{ . }}","stream":false}'
              echo
              {{- end }}
